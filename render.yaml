services:
  - type: web
    name: flash-news-flutter
    runtime: static
    buildCommand: bash build.sh
    staticPublishPath: build/web
    # Flutter web uses client-side routing, so every path must serve index.html
    # rather than returning a 404.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
